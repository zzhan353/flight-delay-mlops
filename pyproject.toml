[project]
name = "flight-delay-mlops"
version = "0.1.0"
description = "Production MLOps pipeline predicting US flight arrival delays, built to run for under $1/month"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "mlflow>=2.17",
    "pydantic>=2.9",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
azure = ["azure-ai-ml>=1.21", "azure-identity>=1.19", "azureml-mlflow"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_delay"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits a live external API (deselect with '-m \"not network\"')"]
